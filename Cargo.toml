[workspace]
resolver = "3"
members = ["crates/engine"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
